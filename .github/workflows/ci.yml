name: Testes ItauBot CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test_itaubot:
    runs-on: windows-itaubot
  
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # 🚨 PASSO 1: Configurar PATH do Python Local (CRÍTICO para o erro SSL/DLL)
      - name: 🛠️ Configurar PATH do Python Local
        run: |
          # Confirma o PATH da sua instalação de Python 3.11 no seu PC
          $PythonBase = "C:\Users\Pedro\AppData\Local\Programs\Python\Python311"
          
          # Adiciona o caminho da instalação (para DLLs/SSL) e dos Scripts (para executáveis) ao PATH
          echo "$PythonBase" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "$PythonBase\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          
      # 🚨 PASSO 2: Configurar Encoding (CRÍTICO para o erro UnicodeDecodeError)
      - name: 💬 Configurar Encoding (chcp 65001)
        # O 'chcp 65001' define o console para UTF-8, resolvendo o problema de caracteres.
        run: chcp 65001

      # 🚨 PASSO 3: Instalar Dependências (Consolidado)
      - name: 📦 Instalar Dependências do Projeto
        # Removido o uso de ensurepip (causa erros) e LANG/LC_ALL (menos eficaz que chcp)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv install --dev --deploy --system

      - name: 🌐 Instalar Browsers do Playwright
        run: |
          pipenv run playwright install --with-deps

      - name: ▶️ Executar Testes Pytest
        env:
          OPERATOR_ITAU: ${{ secrets.OPERATOR_ITAU }}
          PASSWORD_ITAU: ${{ secrets.PASSWORD_ITAU }}
        run: |
          pipenv run pytest src/tests/test_login.py
