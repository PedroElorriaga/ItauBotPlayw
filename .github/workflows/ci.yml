name: Testes ItauBot CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test_itaubot:
    runs-on: windows-itaubot
 
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🛠️ Configurar PATH do Python Local
        run: |
          $PythonBase = "C:\Users\Pedro\AppData\Local\Programs\Python\Python311"
          echo "Adding $PythonBase to PATH"
          echo "$PythonBase" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Adding $PythonBase\Scripts to PATH"
          echo "$PythonBase\Scripts" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 📦 Instalar Dependências do Projeto
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv install --dev --deploy --system
      
      - name: 🌐 Instalar Browsers do Playwright
        run: |
          pipenv run playwright install --with-deps

      - name: ▶️ Executar Testes Pytest
        env:
          OPERATOR_ITAU: ${{ secrets.OPERATOR_ITAU }}
          PASSWORD_ITAU: ${{ secrets.PASSWORD_ITAU }}
        run: |
          pipenv run tests
