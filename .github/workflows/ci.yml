name: Testes ItauBot CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test_itaubot:
    runs-on: windows-itaubot
  
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🛠️ Configurar PATH do Python Local
        run: |
          $PythonBase = "C:\Users\Pedro\AppData\Local\Programs\Python\Python311"
          echo "$PythonBase" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "$PythonBase\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          
      - name: 💬 Configurar Encoding (chcp 65001)
        run: chcp 65001

      - name: 📦 Instalar Dependências do Projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv install --dev --deploy
          
      - name: 🌐 Instalar Browsers do Playwright
        run: |
          pipenv run playwright install --with-deps

      - name: ▶️ Executar Testes Pytest
        env:
          OPERATOR_ITAU: ${{ secrets.OPERATOR_ITAU }}
          PASSWORD_ITAU: ${{ secrets.PASSWORD_ITAU }}
        run: |
          pipenv run pytest src/tests/test_login.py
